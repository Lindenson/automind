[project]
name = "automind"
version = "0.1.0"
description = "AutoMind: conversational automotive research backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.0",
    "langchain-anthropic>=1.7.7",
    "langchain-google-genai>=4",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.3",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=1.30.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pypdf>=6,<7",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0,<2",
    "sqlalchemy[asyncio]>=2",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3,<3",
    "uvicorn[standard]>=0.54.0",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[project.scripts]
automind-api = "automind.delivery.web.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live and not bench'"
markers = [
    "live: calls real models and web search (costs money; opt-in with -m live)",
    "bench: timing benchmarks (slow, not a pass/fail gate; opt-in with -m bench)",
]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
branch = true
source = ["automind"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "C90", "I"]

[tool.ruff.lint.per-file-ignores]
# Assertion helpers are flat lists of checks; the complexity gate applies to src/.
"tests/**" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true

# The strict scope (scripts/check.sh runs these paths; spec 012 R16 grows it step by step). Listed by module so that
# strict applies however mypy is called; the former `automind.domain.*` stopped matching after the S3a tree move.
[[tool.mypy.overrides]]
module = [
    "automind.chat.domain.*", "automind.chat.dialog.policy.*", "automind.shared.vehicle.identity",
    "automind.shared.vehicle.markets", "automind.shared.vehicle.engine", "automind.shared.text.*",
    "automind.shared.vehicle.specs.*", "automind.shared.vehicle.units", "automind.shared.evidence.*",
    "automind.shared.research_order.*", "automind.acquisition.domain.plausibility",
    "automind.acquisition.domain.sense_ev", "automind.acquisition.domain.relevance",
    "automind.observability.domain.outcome", "automind.chat.application.services.research.*",
    "automind.chat.application.services.report.blocks.notice", "automind.chat.application.services.identification.*",
    "automind.chat.application.services.report.*", "automind.shared.contracts.json",
]
strict = true
