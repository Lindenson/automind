      - {key: car#2, make: Kia, model: Sorento, condition: NEW, resolution: CONFIRMED, label: "Sorento MQ4 1.6 T-GDi PHEV"}
  sorento_prado_research_ru:
    chat_language: ru
    cars:
      - {key: car#1, make: Toyota, model: Land Cruiser Prado, condition: USED, resolution: CONFIRMED,
         label: "Land Cruiser Prado J150 2.8 D-4D, replaced: true"}
