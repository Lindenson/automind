      - {key: car#2, make: MG, model: ZS, condition: NEW, resolution: CONFIRMED, label: "MG ZS Hybrid+ 1.5 197 CV"}

  # pre-prod fcf5b3b8 / 2f8b0018: replace a 10-year-old Prado J150 by a new Sorento PHEV
  sorento_prado_report_ru:
    chat_language: ru
    report_shown: true
