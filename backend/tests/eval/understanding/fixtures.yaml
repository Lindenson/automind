# Spec 013 T004: the small named case files and open questions the golden message set refers to.
#
# `cases:` a case file as the understanding step sees it (cars by key, whether a report was shown, the chat's stable
#   language; null = the first message of a chat). No catalogue: a car that is not CONFIRMED / AUTO_OK still needs
#   identification.
# `pendings:` an open bot question (understanding-spec §4 "Требование к Pending"): id, kind, the question as asked,
#   and per item the car it concerns, its topic and the options with ids. Option ids follow S1's scheme
#   (`domain/intake/option_ids.py`: `q:<car>:<KIND>:<n>`, `gb:<car>:<gearbox>`, `condition:<NEW|USED>`, `choose`,
#   `remove:<car>`, `yes:<car>`, `no:<car>`) and today's confirmation ids (card `yes|stop`, variants
#   `option:<car>:<variant>` + `choose`, limit `continue|stop`; cost `run|skip` as the golden dialogues name them).
#   `case:` names the case file the pending belongs to.

cases:
  empty_ru: {chat_language: null, cars: []}
  empty_es: {chat_language: null, cars: []}
  empty_en: {chat_language: null, cars: []}

  # g1 / g16: Bigster vs used Prado
  bigster_prado_age_en:
    chat_language: en
    cars:
      - {key: car#1, make: Dacia, model: Bigster, condition: NEW, resolution: AUTO_OK}
      - {key: car#2, make: Toyota, model: Land Cruiser Prado, condition: USED, resolution: UNRESOLVED}
  bigster_prado_card_ru:
    chat_language: ru
    cars:
      - {key: car#1, make: Dacia, model: Bigster, condition: NEW, resolution: AUTO_OK}
      - {key: car#2, make: Toyota, model: Land Cruiser Prado, condition: USED, resolution: PROPOSED,
         label: "Land Cruiser Prado J150 2.8 D-4D"}
  bigster_prado_report_en:
    chat_language: en
    report_shown: true
    cars:
      - {key: car#1, make: Dacia, model: Bigster, condition: NEW, resolution: CONFIRMED}
      - {key: car#2, make: Toyota, model: Land Cruiser Prado, condition: NEW, resolution: CONFIRMED,
         label: "Land Cruiser Prado J250 2.8 D-4D"}

  # Kia Sportage alone (card / engine question / report) and with the Tucson (pre-prod 3e19d5dd)
  sportage_card_ru:
    chat_language: ru
    cars:
      - {key: car#1, make: Kia, model: Sportage, condition: NEW, resolution: PROPOSED, label: "Sportage NQ5 1.6 T-GDi HEV"}
  sportage_engine_ru:
    chat_language: ru
    cars:
      - {key: car#1, make: Kia, model: Sportage, condition: NEW, resolution: UNRESOLVED}
  sportage_report_ru:
    chat_language: ru
    report_shown: true
    cars:
      - {key: car#1, make: Kia, model: Sportage, condition: NEW, resolution: CONFIRMED, label: "Sportage NQ5 1.6 T-GDi HEV"}
  sportage_tucson_ru:
    chat_language: ru
    cars:
      - {key: car#1, make: Kia, model: Sportage, condition: NEW, resolution: UNRESOLVED, fuel: hybrid}
      - {key: car#2, make: Hyundai, model: Tucson, condition: NEW, resolution: UNRESOLVED, fuel: hybrid}

  # g17: CX-60 vs i10, both new, engine questions open
  cx60_i10_ru:
    chat_language: ru
    cars:
      - {key: car#1, make: Mazda, model: CX-60, condition: NEW, resolution: UNRESOLVED}
      - {key: car#2, make: Hyundai, model: i10, condition: NEW, resolution: UNRESOLVED}

  # pre-prod d170b861 / g13: the person wrote "Clase C Berlina", identification put the E-Class
  eclass_cx60_ru:
    chat_language: ru
    cars:
      - {key: car#1, make: Mercedes-Benz, model: E-Class, condition: UNKNOWN, resolution: UNRESOLVED,
         request_text: Clase C Berlina мерседес}
      - {key: car#2, make: Mazda, model: CX-60, condition: UNKNOWN, resolution: UNRESOLVED}
  # pre-prod eb81dd90: the C-Class is already in the case
  cclass_cx60_ru:
    chat_language: ru
    cars:
      - {key: car#1, make: Mercedes-Benz, model: C-Class, condition: UNKNOWN, resolution: UNRESOLVED}
      - {key: car#2, make: Mazda, model: CX-60, condition: UNKNOWN, resolution: UNRESOLVED}
  eclass_cx60_es:
    chat_language: es
    cars:
      - {key: car#1, make: Mercedes-Benz, model: E-Class, condition: NEW, resolution: PROPOSED, request_text: Clase C}
