    question: Проверьте, что я понял, и подтвердите — после этого начну исследование.
    items:
      - car: null
        topic: CARD
        options:
          - {id: "yes", label: "Да, исследовать"}
          - {id: stop, label: "Пока не надо"}
      - car: car#2
        topic: PROPOSE
        options:
