# Spec 013 T004: the golden message set of the understanding layer. Format and checks: schema.py, coverage.py,
# README.md. `fixture` / `pending` name entries of fixtures.yaml. `expect` holds only the significant fields:
# `answer` absent = no answer to the open question; `goals` absent = none; `reaction` absent = not checked;
# `rejections` / `changes` absent = not checked. `words` = phrases word lists the message carries ("LIST:word");
# `patches` = interpreter.md v5 rules / examples the case keeps alive.

