turns:
- user: Mazda CX-60 или Hyundai i10, обе новые?
  expect:
    action: ASK
    cars:
      car#1:
        model: CX-60
        asked_level: ENGINE
        settled: false
      car#2:
        model: i10
        asked_level: ENGINE
        settled: false
- user: а что такое DSG?
  expect:
    reply_not_contains:
    - Я не понял ответ
    - Такого двигателя
    - Такой двигатель у
    cars:
      car#1:
        asked_level: ENGINE
        settled: false
      car#2:
        asked_level: ENGINE
        settled: false
  known_bug: the person's question is read as an answer to the open engine question (spec 013 B4) — S4 T041
- user: давай сравним с BMW
  expect:
    cars:
      car#1:
        settled: false
      car#2:
        settled: false
    case:
      cars[0].chosen_for_me: false
      cars[1].chosen_for_me: false
  known_bug: '"давай" read as go-ahead: both cars chosen for the person, the BMW lost (spec 013 B4) — S4 T042'
