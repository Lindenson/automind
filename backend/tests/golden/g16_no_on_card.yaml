id: g16_no_on_card
description: >-
  Spec 013 B3: a typed "нет" on the intake card. `apply_intake` reads it with the word lists (≤ 3 words, no digits) as `stop`,
  which marks every proposed car CONFIRMED and declines the research: "no" confirms the wrong car. Starts as G1 (Bigster
  vs used Prado → card).
scenario: empty
seed:
- make: Dacia
  model: Bigster
  generation: Mk1
  variant_name: TCe 140 mild hybrid
  powertrain: MHEV
  body_class: SUV
  years:
  - 2025
  - null
  vehicle_class: compact
  segment: C-SUV
  cached: true
  specs:
    max_power: 103
    curb_mass: 1438
    max_torque: 230
    drivetrain: FWD
    official_price_es: 24990
- make: Toyota
  model: Land Cruiser Prado
