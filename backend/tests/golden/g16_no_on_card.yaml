turns:
- user: >-
    I don't want to spend too much, but I don't want rubbish either. A brand-new Dacia Bigster or a used Land Cruiser Prado?
  expect:
    action: ASK
    status: DONE
    max_questions: 3
    no_search: true
    case:
      persona: BUYER
      cars[0].condition: NEW
      cars[1].condition: USED
      pending.items[0].kind: USED_AGE
      pending.items[0].car: car#2
      priorities:
        contains: reliability
- user: about 10 years old, the 150
  expect:
    status: WAITING_CONFIRMATION
    confirm_kind: intake
    no_search: true
    variants:
    - car: car#2
      generation: J150
      years_include: 2015
    no_variant_generation:
    - J250
    case:
      cars[1].age_years: 10
      cars[1].resolution: PROPOSED
      cars[0].resolution: AUTO_OK
- user: нет
  expect:
    no_search: true
    case:
      cars[1].resolution: PROPOSED
      intake.card_confirmed: false
