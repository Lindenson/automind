turns:
- user: Хочу новый Hyundai i10 1.0 MPI 63 CV
  expect:
    action: ASK
    cars:
      car#1:
        model: i10
        asked_level: GEARBOX
        settled: false
- user: Очень плохо! Ты ничего не нашел
  known_bug: a complaint is parsed as an answer (bug 6) and the same question repeats (bug 7) — S4/S5
  expect:
    cars:
      car#1:
        settled: false
    reply_not_contains:
    - Я не понял ответ
    not_repeated: true
- user: Ты опять ничего не нашел
  known_bug: the gearbox settled to manual without an answer (bug 8) — S5 I5
  expect:
    cars:
      car#1:
        settled: false
