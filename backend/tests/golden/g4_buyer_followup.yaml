id: g4_buyer_followup
description: >
  Golf GTI Mk8 vs i30 N for a race enthusiast, then "and for a smart buyer?" (FR-046d). The second turn
  switches the persona, researches nothing that is cached, does not repeat the report, and reorders it for a buyer.
scenario: empty
seed:
  - {make: Volkswagen, model: Golf, generation: Mk8, variant_name: GTI 2.0 TSI 245 PS DSG, powertrain: ICE,
     body_class: HATCHBACK, years: [2020, 2023], vehicle_class: compact, segment: C, cached: true,
     specs: {max_power: 180, curb_mass: 1429, max_torque: 370, drivetrain: FWD, claimed_0_100: 6.2, consumption: 7.0,
             boot_volume: 374, seats: 5, official_price_es: 47500}}
  - {make: Hyundai, model: i30 N, generation: PDe, variant_name: 2.0 T-GDi 280 PS, powertrain: ICE,
     body_class: HATCHBACK, years: [2017, null], vehicle_class: compact, segment: C, cached: true,
     specs: {max_power: 206, curb_mass: 1480, max_torque: 392, drivetrain: FWD, claimed_0_100: 5.9, consumption: 8.1,
             boot_volume: 381, seats: 5, official_price_es: 41990}}
turns:
  - user: "Golf GTI Mk8 vs i30 N for a race enthusiast"
    expect:
      action: REPORT
      no_search: true
      block_order_starts_with: [verdict, case_summary, race_chart]
      case: {persona: PERFORMANCE}
  - user: "and for a smart buyer?"
    expect:
      action: ANSWER_FROM_CONTEXT
      no_search: true
      researched: []
      block_order_starts_with: [verdict, case_summary, criteria_scores, tco]
      case: {persona: BUYER}
