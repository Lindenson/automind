id: g5_add_third_car
description: >
  After Golf GTI vs i30 N, "add the Tesla Model 3 Performance" (FR-046e): only the Tesla is researched and the
  comparison has 3 cars; a 4th car makes the hub ask which 3 to compare.
scenario: empty
seed:
  - {make: Volkswagen, model: Golf, generation: Mk8, variant_name: GTI 2.0 TSI 245 PS DSG, powertrain: ICE,
     body_class: HATCHBACK, years: [2020, 2023], vehicle_class: compact, segment: C, cached: true,
     specs: {max_power: 180, curb_mass: 1429, max_torque: 370, drivetrain: FWD, claimed_0_100: 6.2}}
  - {make: Hyundai, model: i30 N, generation: PDe, variant_name: 2.0 T-GDi 280 PS, powertrain: ICE,
     body_class: HATCHBACK, years: [2017, null], vehicle_class: compact, segment: C, cached: true,
     specs: {max_power: 206, curb_mass: 1480, max_torque: 392, drivetrain: FWD, claimed_0_100: 5.9}}
  - {make: Tesla, model: Model 3, generation: Highland, variant_name: Performance AWD, powertrain: BEV,
     body_class: SEDAN, years: [2023, null], vehicle_class: mid_large, segment: D, cached: false}
turns:
  - user: "Golf GTI Mk8 vs i30 N for a race enthusiast"
    expect: {action: REPORT, no_search: true}
  - user: "add the Tesla Model 3 Performance"
    expect:
      action: REPORT
      researched: ["car#3"]
      variants: [{car: "car#3", model: Model 3, generation: Highland}]
      case:
        cars[2].resolution: AUTO_OK
        cars[3]: null
  - user: "and a BMW M3 too"
    expect:
      action: ASK
      no_search: true
      case:
        pending.items[0].kind: TOO_MANY_CARS
