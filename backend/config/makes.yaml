# Makes sold in Spain (spec 005 R2, R3): canonical name, aliases (lower case, any language), Russian
# transliterations, the official Spanish site and the parent group. A make here is "known" even when the catalog
# has none of its models; its line-up is looked up on the web with sources (application/lineup.py).
# new_in_market (spec 006 FR-018): a recent make in Spain; without sourced resale values its depreciation is
# "insufficient data", never a class curve.
# home (chat 2026-11-06, Deepal S09 vs Li Auto L9): the market a make comes from. A model not on the Spanish line-up
# (or a make with no es_site: not sold in Spain at all) is looked up where it is sold — Europe first, then `home`,
# then elsewhere (config/search.yaml `abroad`); `home_site` is the maker's site there (its line-up page).
