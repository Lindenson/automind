# Web search (research R1–R3, R16). The provider is chosen here; env SEARCH_PROVIDER overrides it.
# Results are hits only (url, title, snippet); page text always comes from our own page store.
version: 1
provider: serper            # serper | serpapi | tavily
fallback: [tavily]          # tried in order when the provider fails, has no key or no credit
num: 10                     # results per query
cache_ttl_days: {default: 7, price: 3}
empty_result_ttl_hours: 6   # an empty answer is kept briefly, so the next research searches again (spec 007 FR-021)
favourite_retry: true       # a favourite query with no hits is tried once more, shorter (FR-021)
# Learned sources (FR-022): a domain with accepted values in `min_runs` research runs joins round 0 after the
# configured favourites (at most `per_area` per market); it drops out after `max_misses` runs without a value.
learned: {min_runs: 3, max_misses: 5, per_area: 4}
markets:                    # case market → provider locale
  ES: {gl: es, hl: es}
  EN: {gl: gb, hl: en}
  DE: {gl: de, hl: de}
  FR: {gl: fr, hl: fr}       # registry sources of other European markets (spec 009 FR-009: Europe is one market)
  IT: {gl: it, hl: it}
  PT: {gl: pt, hl: pt}
  NL: {gl: nl, hl: nl}
  SE: {gl: se, hl: sv}
  DK: {gl: dk, hl: da}
  NO: {gl: no, hl: no}
  FI: {gl: fi, hl: fi}
  PL: {gl: pl, hl: pl}
  CZ: {gl: cz, hl: cs}
  US: {gl: us, hl: en}
  JP: {gl: jp, hl: ja}
  RU: {gl: ru, hl: ru}
  ANY: {gl: gb, hl: en}
default_markets: [ES, EN]   # markets searched when the case does not name one (cars are priced for Spain)
area_markets:               # markets searched per area (German instrumented tests and breakdown statistics help)
  measured: [ES, EN, DE]
  reliability: [ES, EN, DE]
  used_issues: [ES, EN, DE]
  used_price: [ES, EN, DE]  # Europe is one market (spec 009 FR-009): German valuers and clubs too
  depreciation: [ES, EN]   # residual values: Spanish and UK analysts (spec 004)
sites_per_query: 4          # favourite sites grouped into one `site:a OR site:b` query
ai_followup: {max_queries_per_area: 3, depths: [DEEP, STANDARD]}
limits: {max_pages_per_job: 6, max_fetch_bytes_per_turn: 40000000}
# Parallel research (spec 004 FR-032): pages of a job run as independent pipelines (relevance → extraction →
# validation → storage). llm_per_job bounds model calls of one job; llm_total bounds them across all jobs.
concurrency: {llm_per_job: 6, llm_total: 16}

# Intake (spec 005 R6, R2): bounded attempts per question item and per car; brand line-up cache.
intake: {max_attempts_per_item: 2, max_attempts_per_car: 4, full_intake: true, lineup_ttl_days: 30, lineup_max_pages: 2,
         versions_ttl_days: 60, versions_read_pages: 6, versions_max_pages: 3, versions_min: 3, km_per_year_used: 15000, default_used_age: 5,
         catalog_stale_years: 4}  # spec 008; a new car's only catalog rows older than this are asked about once

# Interpreter context (spec 007 FR-005): the profile is inferred from the dialogue, so it sees more of it.
interpret: {history_turns: 16, history_chars: 800}
