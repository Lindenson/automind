# Model per role: "<provider>:<model>" (constitution VII). Override with env MODEL_<ROLE>.
# 2026-11-02: switched from OpenAI (gpt-5.4 / gpt-5.4-mini) to Gemini — OpenAI credit is nearly used up.
# Previous setting for a rollback: interpreter/resolver/reporter/answerer/hub/analyst openai:gpt-5.4, the rest
# openai:gpt-5.4-mini.
interpreter: google_genai:gemini-3.6-flash
asker: google_genai:gemini-3.1-flash-lite
resolver: google_genai:gemini-3.6-flash
extractor: google_genai:gemini-3.1-flash-lite
validator: google_genai:gemini-3.1-flash-lite
reporter: google_genai:gemini-3.6-flash
answerer: google_genai:gemini-3.6-flash
general: google_genai:gemini-3.1-flash-lite
query_planner: google_genai:gemini-3.1-flash-lite  # proposes follow-up search queries; never sees page text
terms_reader: google_genai:gemini-3.1-flash-lite   # spec 010: web reader, does a site's terms forbid automated access?
relevance: google_genai:gemini-3.1-flash-lite      # web reader: is this page about the exact variant?
lineup: google_genai:gemini-3.1-flash-lite         # web reader (spec 005): models of a make on sale in Spain
versions: google_genai:gemini-3.6-flash            # web reader: versions of a model generation (version ladder)
# Spec 011 engine agents (worker only, daily budgets in config/agents.yaml):
scout: google_genai:gemini-3.1-flash-lite            # web reader, no tools: query wording for gaps
parser_doctor: google_genai:gemini-3.6-flash         # web reader, no tools: drafts a declarative parser spec
rule_auditor: google_genai:gemini-3.1-flash-lite     # web reader, no tools: explains a bounded rule change
extractor_tuner: google_genai:gemini-3.1-flash-lite  # web reader, no tools: proposes an extraction prompt edit
blame_judge: google_genai:gemini-3.1-flash-lite      # web reader, no tools: which component erred, with a quote
# Legacy demo roles (removed when the demo graph is replaced, T035/T060):
hub: google_genai:gemini-3.6-flash
analyst: google_genai:gemini-3.6-flash

# Extra model options (passed to the provider). Gemini 3 "thinking" is kept low: the roles here have
# structured outputs and code-side checks, and full thinking was 8× the output tokens and 5× slower.
options:
  google_genai:gemini-3.6-flash: {thinking_level: low}

# When a model's quota is used up (e.g. 20 requests/day per model on the Gemini free tier), the gateway
# switches the role to the next model here until the quota resets. Each Gemini model has its own quota.
fallbacks:
  google_genai:gemini-3.6-flash: [google_genai:gemini-3.5-flash, google_genai:gemini-3.1-flash-lite]
  google_genai:gemini-3.1-flash-lite: [google_genai:gemini-3.5-flash-lite, google_genai:gemini-2.5-flash-lite]
