  - {domain: evo.co.uk, source_type: INSTRUMENTED_TEST, areas: [measured, reviews], markets: [EN], priority: 2, reader: null, tos_checked: null}
  - {domain: autoexpress.co.uk, source_type: PUBLICATION, areas: [measured, reviews, reliability], markets: [EN], priority: 2, reader: null, tos_checked: null}
