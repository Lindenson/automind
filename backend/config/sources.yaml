# Source typing, deny-list and fetch policy (constitution I, VIII; FR-017, FR-022).
# Loaded by automind.shared.infrastructure.config.loader and passed into automind.shared.evidence.evidence.
version: 1
# Brands whose own sites are MANUFACTURER sources: the host's registrable name must be exactly one of these
# (toyota.es, bmw.com.sg, owners-manual.mazda.com) or a brand TLD (concesionarios.seat). A brand inside a longer
# name is a publication: toyota-club.net, clubseat.es, marinmazda.net (dealer), hondapartsnow.com, img.cdn.com.
manufacturer_markers: [volkswagen, vw, hyundai, tesla, bmw, mercedes, mercedesbenz, audi, seat, cupra, skoda, toyota,
  honda, porsche, renault, peugeot, citroen, kia, ford, mazda, nissan, volvo, volvocars, opel, fiat, alfaromeo, lexus,
  mini, polestar, byd, mg, subaru, dacia, landrover, jaguar, jeep, suzuki, mitsubishi, ds, dsautomobiles, smart,
  genesis, lynkco, omoda, jaecoo, leapmotor, xpeng, nio, zeekr, chery, ssangyong, kgm, maserati, ferrari,
  lamborghini, bentley, astonmartin, rollsroyce, bugatti, lotus, mclaren, alpine, abarth, lancia, infiniti]
# Official domains whose name is not a bare brand: press and media centres, groups, regional official sites.
# The hosts of manufacturer_sites below are official too.
official_domains: [seat-cupra-mediacenter.es, seat-mediacenter.com, cupraofficial.com, bmwgroup.com,
  press.bmwgroup.com, mercedes-benz.com, group-media.mercedes-benz.com, renaultgroup.com, stellantis.com,
  media.stellantis.com, mazda-press.com, skoda-auto.com, skoda-storyboard.com, hyundai-n.com, hyundainews.com,
  kianewscenter.com, toyota-europe.com, newsroom.toyota.eu, vwgroup.com, volkswagen-newsroom.com,
  volkswagenag.com, audi-mediacenter.com, porsche-newsroom.com, volvocars.com, media.volvocars.com,
  bydukmedia.com, bydeurope.com, mgmotor.eu, mgmotor.co.uk, mgmotor.es, nissan-global.com, honda-mideast.com,
  ford.co.uk, fordmedia.eu, media.ford.com, polestar.com, lexus-europe.com, dsautomobiles.com, jaguarlandrover.com,
  media.jaguarlandrover.com]
non_manufacturer_hints: [forum, blog, news, magazine, review, wiki]
instrumented: [caranddriver.com, motortrend.com, auto-motor-und-sport.de, autobild.de, whatcar.com, evo.co.uk]
encyclopedia: [wikipedia.org]
spec_db: [ultimatespecs.com, cars-data.com, fichasmotor.com, automobile-catalog.com, carfolio.com]
# Classifieds and sites whose terms forbid automated access: never searched, extracted or fetched.
denylist: [coches.net, cochesnet, wallapop.com, milanuncios.com, autoscout24., mobile.de, autocasion.com,
  flexicar.es, motor.es/coches-segunda-mano,
  # spec 009 source survey 2026-11-05: terms forbid automated access (quotes in specs/009-source-registry/registry-survey.yaml)
  auto-data.net, autobild.es, drive.co.uk, honestjohn.co.uk, buyacar.co.uk, parkers.co.uk, bauerlegal.co.uk,
  largus.fr, alvolante.it, autoweek.nl, spritmonitor.de, drom.ru, zr.ru, cap-hpi.com, ocu.org, zapmap.com,
  nextgreencar.com, ncts.ie, webuyanycar.com, motorway.co.uk, leboncoin.fr, lacentrale.fr, blocket.se, carzone.ie,
  automobile.it, willhaben.at,
  # chat fcf5b3b8 (2026-11-05): listing aggregators are classifieds too (12gebrauchtwagen gave a junk Prado price)
  12gebrauchtwagen.de, autouncle., kleinanzeigen.de, pkw.de, heycar., autotrader., cargurus., truecar.com,
  carvago.com, autohero.com, coches.com/coches-segunda-mano, autocasion., motor.es/segunda-mano,
  # sources revision 2026-11-05 (docs/history/sources-revision-2026-11-05.md). Matching is a substring of host+path, so these are
  # full domains or domain/path; auto.ru, cars.com, cars.ie, auto.cz and autohaus.de are left out on purpose (they would
  # also hit skoda-auto.ru, iseecars.com, bestcars.ie, skoda-auto.cz, dealer sites) — the registry blocks them by entry.
  # classifieds already in the 009 survey:
  avito.ru, bilbasen.dk, bytbil.com, carsireland.ie, cazoo.co.uk, che168.com, cinch.co.uk, dba.dk, donedeal.ie,
  encar.com, finn.no, gaspedaal.nl, guazi.com, gumtree.com, kvd.se, marktplaats.nl, motors.co.uk, nettiauto.com,
  olx.pt, standvirtual.com, subito.it, carsensor.net, goo-net.com,
  # classifieds found in this revision (Kazakhstan/CIS, CEE, Middle East, Latin America):
  kolesa.kz, mycar.kz, drom.kz, auto.ria.com, av.by, avtoelon.uz, myauto.ge, otomoto.pl, sauto.cz, tipcars.com,
  hasznaltauto.hu, autovit.ro, car.gr/classifieds, sahibinden.com, arabam.com, dubizzle.com, yad2.co.il,
  webmotors.com.br, icarros.com.br,
  # listing sections of otherwise usable sites:
  automoto.it/auto-usate, theaa.com/used-cars, kakaku.com/kuruma/used, carwale.com/used, yallamotor.com/used-cars,
  bevolt.com/fr-fr/automobile/occasions,
  # terms forbid automated access (quotes in registry_seed_survey.yaml, survey revision_2026_11_05):
  autogids.be, moniteurautomobile.be, autokult.pl, autorevue.cz, turbo.fr, tuulilasi.fi, evspecifications.com,
  autoflotte.de, kfz-betrieb.vogel.de, fairgarage.com, vroomly.com, auto.mail.ru, lada.kz, icar.co.il,
  autocarindia.com, overdrive.in/, cardekho.com, autoesporte.globo.com]
fetch:
  timeout_s: 15
  max_bytes: 3000000
  min_interval_per_host_s: 2.0
  robots_cache_hours: 24
  user_agent: "AutoMindResearchBot/0.2 (+local single-user research tool)"
  allowed_content_types: [text/html, application/pdf, text/plain]
  max_concurrency_per_host: 2
  max_concurrency_total: 8
  max_redirects: 5
  retries: 2                  # retries of a GET after 429, 5xx, timeout or connection error
  retry_backoff_s: [1, 3]     # wait before retry 1, 2 (the last value repeats)
  retry_after_cap_s: 10       # a Retry-After header (429/503) is honoured up to this many seconds

# Favourite sources (spec 003 FR-011, research R5): queried first, per research area and market.
# source_type: MANUFACTURER | INSTRUMENTED_TEST | SPEC_DATABASE | PUBLICATION | ENCYCLOPEDIA.
# markets: ES | EN | DE | ANY. priority: 1 (first) … 3. reader: deterministic table reader id or null.
# tos_checked: date the operator reviewed the site's terms of use; a reader runs only when it is set.
# km77, ultimatespecs: terms reviewed and readers enabled by the operator on 2026-11-02. auto-data.net removed on
# 2026-11-05: its terms forbid automated collection (spec 009 survey).
# robots.txt allowed the sample car pages for our user agent on 2026-11-02 (whatcar.com: robots 403 → never fetched).
favourites:
  # --- Spain ---
  - {domain: km77.com, source_type: SPEC_DATABASE, areas: [specs, engineering, measured, price, maintenance, reviews, reliability, used_issues, used_price], markets: [ES], priority: 1, reader: km77, tos_checked: 2026-11-02}
  - {domain: motor.es, source_type: PUBLICATION, areas: [specs, reviews, price, depreciation, manufacturer, used_price], markets: [ES], priority: 2, reader: null, tos_checked: null}
  - {domain: autopista.es, source_type: INSTRUMENTED_TEST, areas: [measured, reviews, reliability, used_issues, used_price, price, depreciation], markets: [ES], priority: 1, reader: null, tos_checked: null}
  # spec 006 US5: official pages for incentives (programme rules, dates, amounts)
  - {domain: idae.es, source_type: PUBLICATION, areas: [incentives], markets: [ES], priority: 1, reader: null, tos_checked: null}
  - {domain: boe.es, source_type: PUBLICATION, areas: [incentives], markets: [ES], priority: 1, reader: null, tos_checked: null}
  - {domain: agenciatributaria.gob.es, source_type: PUBLICATION, areas: [incentives], markets: [ES], priority: 2, reader: null, tos_checked: null}
  - {domain: fichasmotor.com, source_type: SPEC_DATABASE, areas: [specs], markets: [ES], priority: 3, reader: null, tos_checked: null}
  # --- English ---
