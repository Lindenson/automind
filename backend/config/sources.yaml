  - {domain: adac.de, source_type: PUBLICATION, areas: [specs, maintenance, reliability, used_issues, used_price, depreciation], markets: [DE], priority: 1, reader: null, tos_checked: null}
  # spec 009 survey 2026-11-05, verdict candidate (robots allow the model pages, no automated-access clause in the
