# Source typing, deny-list and fetch policy (constitution I, VIII; FR-017, FR-022).
# Loaded by automind.infrastructure.config and passed into automind.domain.evidence.
version: 1
manufacturer_markers: [volkswagen, vw., hyundai, tesla, bmw, mercedes, audi, seat, cupra, skoda, toyota, honda,
  porsche, renault, peugeot, citroen, kia, ford, mazda, nissan, volvo, opel, fiat, alfaromeo, lexus, mini., polestar,
  byd, mg., subaru, dacia, landrover, jaguar, jeep, suzuki, mitsubishi, ds.]
non_manufacturer_hints: [forum, blog, news, magazine, review, wiki]
instrumented: [caranddriver.com, motortrend.com, auto-motor-und-sport.de, autobild.de, whatcar.com, evo.co.uk]
encyclopedia: [wikipedia.org]
spec_db: [ultimatespecs.com, auto-data.net, cars-data.com, fichasmotor.com, automobile-catalog.com, carfolio.com]
# Classifieds and sites whose terms forbid automated access: never searched, extracted or fetched.
denylist: [coches.net, cochesnet, wallapop.com, milanuncios.com, autoscout24., mobile.de, autocasion.com,
  flexicar.es, motor.es/coches-segunda-mano]
fetch:
  timeout_s: 15
  max_bytes: 3000000
  min_interval_per_host_s: 2.0
  robots_cache_hours: 24
  user_agent: "AutoMindResearchBot/0.2 (+local single-user research tool)"
  allowed_content_types: [text/html, application/pdf, text/plain]
max_concurrency_per_host: 2
max_concurrency_total: 8
max_redirects: 5

# Favourite sources (spec 003 FR-011, research R5): queried first, per research area and market.
# source_type: MANUFACTURER | INSTRUMENTED_TEST | SPEC_DATABASE | PUBLICATION | ENCYCLOPEDIA.
# markets: ES | EN | DE | ANY. priority: 1 (first) … 3. reader: deterministic table reader id or null.
# tos_checked: date the operator reviewed the site's terms of use; a reader runs only when it is set.
# robots.txt allowed the sample car pages for our user agent on 2026-11-02 (whatcar.com: robots 403 → never fetched).
favourites:
  # --- Spain ---
  - {domain: km77.com, source_type: SPEC_DATABASE, areas: [specs, engineering, measured, price, maintenance, reviews, reliability, used_issues, used_price], markets: [ES], priority: 1, reader: km77, tos_checked: null}
  - {domain: motor.es, source_type: PUBLICATION, areas: [specs, reviews, price], markets: [ES], priority: 2, reader: null, tos_checked: null}
  - {domain: autopista.es, source_type: INSTRUMENTED_TEST, areas: [measured, reviews, reliability, used_issues, used_price], markets: [ES], priority: 1, reader: null, tos_checked: null}
  - {domain: fichasmotor.com, source_type: SPEC_DATABASE, areas: [specs], markets: [ES], priority: 3, reader: null, tos_checked: null}
  # --- English ---
  - {domain: ultimatespecs.com, source_type: SPEC_DATABASE, areas: [specs, engineering], markets: [ANY], priority: 1, reader: ultimatespecs, tos_checked: null}
  - {domain: auto-data.net, source_type: SPEC_DATABASE, areas: [specs, engineering], markets: [ANY], priority: 1, reader: auto_data, tos_checked: null}
  - {domain: cars-data.com, source_type: SPEC_DATABASE, areas: [specs], markets: [EN], priority: 3, reader: null, tos_checked: null}
  - {domain: parkers.co.uk, source_type: PUBLICATION, areas: [specs, maintenance, used_price, reviews], markets: [EN], priority: 2, reader: null, tos_checked: null}
  - {domain: caranddriver.com, source_type: INSTRUMENTED_TEST, areas: [measured, reviews], markets: [EN], priority: 1, reader: null, tos_checked: null}
  - {domain: evo.co.uk, source_type: INSTRUMENTED_TEST, areas: [measured, reviews], markets: [EN], priority: 2, reader: null, tos_checked: null}
  - {domain: autoexpress.co.uk, source_type: PUBLICATION, areas: [measured, reviews, reliability], markets: [EN], priority: 2, reader: null, tos_checked: null}
  - {domain: honestjohn.co.uk, source_type: PUBLICATION, areas: [maintenance, reliability, used_issues, used_price, reviews], markets: [EN], priority: 1, reader: null, tos_checked: null}
  - {domain: carwow.co.uk, source_type: PUBLICATION, areas: [reviews], markets: [EN], priority: 3, reader: null, tos_checked: null}
  # --- German ---
  - {domain: auto-motor-und-sport.de, source_type: INSTRUMENTED_TEST, areas: [measured, reviews], markets: [DE], priority: 1, reader: null, tos_checked: null}
  - {domain: autobild.de, source_type: INSTRUMENTED_TEST, areas: [measured, reviews, reliability, used_issues, used_price], markets: [DE], priority: 1, reader: null, tos_checked: null}
  - {domain: adac.de, source_type: PUBLICATION, areas: [specs, maintenance, reliability, used_issues, used_price], markets: [DE], priority: 1, reader: null, tos_checked: null}
  # --- any market ---
  - {domain: wikipedia.org, source_type: ENCYCLOPEDIA, areas: [engineering, manufacturer], markets: [ANY], priority: 2, reader: null, tos_checked: null}

