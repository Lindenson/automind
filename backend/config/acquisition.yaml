# The system reads this file and never writes it (constitution XII).
# Spec 011 acquisition engine. This branch (US2 worker) adds `worker`, `schedule`, `prefetch` and `tasks`; the US1
# branch adds `snapshots` (and later `drift`, `replay`) to the same file: merge the sections.
version: 1

# The worker process (python -m automind.acquisition.worker, contracts/task-queue.md)
worker:
  concurrency: 2        # tasks at once per worker
  llm_concurrency: 2    # model calls in flight in the worker (own limit, user turns keep theirs)
  lease_s: 300          # a claimed task belongs to the worker this long; extended every lease_s/3
  poll_s: 2             # an idle claim loop looks for due tasks this often
  beat_s: 15            # heartbeat (acq_workers.beat_at, automind_worker_beat_timestamp_seconds) and gauges
  schedule_s: 30        # the scheduler enqueues due periodic tasks this often
  grace_s: 20           # on SIGTERM running tasks get this long to finish, then they are released
  metrics_port: 9101    # Prometheus exporter (/metrics); 0 = off

# Periodic tasks. One of: every_s (fixed period), daily "HH:MM" (UTC), hourly [first, last] (UTC hours).
# The dedupe key is `<key>:<period>`, so each period runs once however many workers there are.
# `loop` is the label of the automind_loop_* health gauges (AutomindLoopStale / AutomindLoopFailing).
schedule:
  metrics_snapshot: {every_s: 60, key: snap, loop: metrics}          # the 010 snapshot gauges, served by the worker
  insight_run: {every_s: 600, key: insight, loop: insight}           # checks insight.yaml schedule, runs when due
  registry_review: {daily: "03:00", key: review, loop: registry}     # registry.yaml autonomy decides what it does
  retention_snapshots: {daily: "01:00", key: snapret}                # snapshot retention (US1 T030) when it exists
  prune_tasks: {daily: "01:30", key: prune}                          # old acq_tasks rows (see `tasks`)
  prefetch: {hourly: [6, 22], key: prefetch, enabled: false}         # T057: off until acquire() exists

prefetch:
  enabled: false        # the handler slot completes with {"skipped": "disabled"} while false
  eur_per_day: 0.30
  jobs_per_run: 6
  window_days: 30
  due_within_h: 48

# Journal retention (data-model: done 30 days, dead 90); frequent kinds are kept shorter
tasks:
  done_days: 30
  dead_days: 90
  short_days: {metrics_snapshot: 1, insight_run: 7}
