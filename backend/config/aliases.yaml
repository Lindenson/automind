# Make / model / generation aliases for canonical identity and de-dup (FR-024, research R6).
version: 1
makes:
  vw: Volkswagen
  volkswagen: Volkswagen
  mercedes: Mercedes-Benz
  mercedes benz: Mercedes-Benz
  merc: Mercedes-Benz
  bmw: BMW
  landrover: Land Rover
  range rover: Land Rover
  toyota: Toyota
  hyundai: Hyundai
  dacia: Dacia
  tesla: Tesla
  # chat 2026-11-06: Chinese makes by their transliterations and Chinese names (config/makes.yaml)
  lixiang: Li Auto
  li xiang: Li Auto
  理想: Li Auto
  理想汽车: Li Auto
  deepal: Deepal
  changan deepal: Deepal
  深蓝: Deepal
  深蓝汽车: Deepal
models:
  # "<make>|<alias>" -> canonical model
  "Land Rover|prado": {make: Toyota, model: Land Cruiser Prado}
  "Toyota|prado": Land Cruiser Prado
  "Toyota|land cruiser prado": Land Cruiser Prado
  "Toyota|lc prado": Land Cruiser Prado
  "Toyota|landcruiser prado": Land Cruiser Prado
  "BMW|3 series": 3 Series
  "BMW|serie 3": 3 Series
  "Volkswagen|golf": Golf
  "Land Rover|rr sport": Range Rover Sport
  "Land Rover|range rover sport": Range Rover Sport
  "Li Auto|理想l9": L9
  "Li Auto|理想 l9": L9
  "Li Auto|lixiang l9": L9
  "Deepal|深蓝s09": S09
  "Deepal|深蓝 s09": S09
  "Deepal|deepal s09": S09
generations:
  # "<canonical make>|<canonical model>" -> {alias: canonical generation}
  "Toyota|Land Cruiser Prado": {j150: J150, "150": J150, prado 150: J150, lc150: J150, j250: J250, "250": J250,
                                lc250: J250, j120: J120, "120": J120}
  "Land Rover|Range Rover Sport": {l320: L320, mk1: L320, "1st gen": L320, l494: L494, mk2: L494, l461: L461, mk3: L461}
  "BMW|3 Series": {f30: F30, f31: F30, g20: G20, g21: G20, e90: E90}
  "Volkswagen|Golf": {mk7: Mk7, "7": Mk7, mk7.5: Mk7.5, mk8: Mk8, "8": Mk8, mk8.5: Mk8.5}
  "Hyundai|i30 N": {pd: PDe, pde: PDe}
market_names:
  # "<canonical make>|<canonical model>[|<generation>]" -> {market: the name the model is sold under there}.
  # Search queries use it per market (spec 009 FR-017, FR-021): the Prado J150 is a "Land Cruiser" in Spain and
  # Germany (the big J200 is the "Land Cruiser V8" there); other markets keep the canonical "Land Cruiser Prado".
  "Toyota|Land Cruiser Prado": {ES: Land Cruiser, DE: Land Cruiser}
local_names:
  # "<canonical make>|<canonical model>" -> {market: the whole name as that market writes it}. A car sold only there
  # is searched under it in that market's language and its pages pass relevance by it (chat 2026-11-06, Deepal S09 vs
  # Li Auto L9: Chinese pages write 深蓝S09 / 理想L9, rarely "Deepal" / "Li Auto").
  "Deepal|S09": {CN: 深蓝S09}
  "Deepal|S07": {CN: 深蓝S07}
  "Deepal|S05": {CN: 深蓝S05}
  "Deepal|L07": {CN: 深蓝L07}
  "Deepal|SL03": {CN: 深蓝SL03}
  "Li Auto|L9": {CN: 理想L9}
  "Li Auto|L8": {CN: 理想L8}
  "Li Auto|L7": {CN: 理想L7}
  "Li Auto|L6": {CN: 理想L6}
  "Li Auto|MEGA": {CN: 理想MEGA}
  "Aito|M9": {CN: 问界M9}
  "Aito|M7": {CN: 问界M7}
  "Aito|M5": {CN: 问界M5}
  "Xiaomi|SU7": {CN: 小米SU7}
  "Xiaomi|YU7": {CN: 小米YU7}
