# Search query templates per research area (spec 003 research R2).
# favourite: one query per group of favourite sites ({sites} = `site:a OR site:b …`), run first.
# open: open-web queries, run only when the favourites did not meet the area minimum.
# Placeholders: {make} {model} {generation} {variant} {years} {sites}, and {short} = make + model + a short
# variant key ("BMW 320d Touring", "Volkswagen Golf Variant R 333"; spec 007 FR-020). Favourite queries are short
# and in the market's language: `site:` queries need every word on the page, and pages never write "Mk8.5".
# Classifieds are deny-listed.
version: 3
specs:
  favourite: '{short} ficha técnica {sites}'
  favourite_by_market: {ES: '{short} ficha técnica {sites}', EN: '{short} specs {sites}', DE: '{short} technische Daten {sites}'}
  open:
    - '{make} {model} {generation} {variant} specifications power torque weight 0-100'
    - '{make} {model} {generation} {variant} ficha técnica peso potencia par'
engineering:
  favourite: '{short} motor técnica {sites}'
  favourite_by_market: {EN: '{short} engine technical {sites}', DE: '{short} Motor Technik {sites}'}
  open:
    - '{make} {model} {generation} {variant} engine bore stroke compression ratio platform
  suspension'
    - '{make} {model} {generation} technical analysis chassis drivetrain engineering'
    - '{make} {model} {generation} model year changes facelift update new engine'
measured:
  favourite: '{short} prueba 0-100 {sites}'
  favourite_by_market: {ES: '{short} prueba 0-100 {sites}', EN: '{short} test 0-60 {sites}', DE: '{short} Test Messwerte {sites}'}
  open:
    - '{make} {model} {generation} {variant} instrumented test 0-100 km/h measured'
price:
  favourite: '{short} precio {sites}'
  open:
    - '{make} {model} {variant} precio oficial España PVP'
    - '{make} {model} precio tarifa España {generation}'
maintenance:
  favourite: '{make} {model} mantenimiento {sites}'
  favourite_by_market: {ES: '{make} {model} mantenimiento revisiones {sites}', EN: '{make} {model} service schedule {sites}', DE: '{make} {model} Wartung Inspektion {sites}'}
  open:
    - '{make} {model} {generation} {variant} service schedule maintenance intervals cost'
    - '{make} {model} {generation} plan de mantenimiento revisiones intervalos coste'
reviews:
  favourite: '{short} prueba {sites}'
  favourite_by_market: {ES: '{short} prueba opinión {sites}', EN: '{short} review {sites}', DE: '{short} Test {sites}'}
  open:
    - '{make} {model} {generation} {variant} review pros cons'
    - '{make} {model} {generation} owner reviews opinions problems'
    - '{make} {model} {generation} prueba opinión'
reliability:
  favourite: '{make} {model} fiabilidad problemas {sites}'
  favourite_by_market: {ES: '{make} {model} fiabilidad problemas {sites}', EN: '{make} {model} reliability problems {sites}', DE: '{make} {model} Pannenstatistik Mängel {sites}'}
  open:
    - '{make} {model} {generation} reliability common problems known issues'
    - '{make} {model} {generation} fiabilidad averías comunes'
    - '{make} {model} {generation} TÜV report breakdown statistics'
    - '{make} {model} {generation} ADAC Pannenstatistik TÜV-Report Mängelquote'
manufacturer:
  favourite: '{make} ventas España cuota de mercado concesionarios {sites}'
  open:
    - '{make} car manufacturer history market position premium brand'
    - '{make} market share Europe Spain sales trend'
    - '{make} annual results operating profit automotive'
    - '{make} reliability ranking brand survey'
    - '{make} matriculaciones España cuota de mercado red de concesionarios'
    - '{make} concesionarios talleres red oficial España'
    - '{make} garantía años kilómetros garantía batería España'
    - '{make} número de concesionarios y puntos de servicio en España'
manufacturer_warranty:  # spec 008 FR-027: one open search in round 0 of the manufacturer area
  favourite: '{make} garantía oficial coche nuevo años kilómetros España'
incentives:  # spec 006 US5: market-level, once per market; no car names in the queries
  favourite: 'ayudas compra coche eléctrico plazo importe {sites}'
  open:
    - 'ayudas compra coche eléctrico enchufable 2026 importe plazo MOVES'
    - 'deducción IRPF coche eléctrico 2026 15 % límite plazo'
    - 'plan ayudas vehículo eléctrico comunidad autónoma 2026 convocatoria'
    - 'etiqueta CERO ventajas aparcamiento impuesto circulación bonificación'
depreciation:
  favourite: '{make} {model} valor residual {sites}'
  favourite_by_market: {ES: '{make} {model} valor residual {sites}', EN: '{make} {model} depreciation residual value {sites}', DE: '{make} {model} Wertverlust Restwert {sites}'}
  open:
    - '{make} {model} {generation} residual value after 3 years 5 years depreciation'
    - '{make} {model} valor residual depreciación 3 años 5 años'
    - '{make} {model} {generation} resale value retention ranking'
used_issues:
  favourite: '{make} {model} segunda mano problemas {sites}'
  favourite_by_market: {ES: '{make} {model} segunda mano problemas {sites}', EN: '{make} {model} used buying guide {sites}', DE: '{make} {model} Gebrauchtwagen Schwachstellen {sites}'}
  open:
    - '{make} {model} {generation} {years} used buying guide what to check high mileage'
    - '{make} {model} {generation} timing belt gearbox rust problems age mileage'
    - '{make} {model} {generation} segunda mano qué revisar problemas'
used_price:
  favourite: '{make} {model} {years} precio segunda mano {sites}'
  favourite_by_market: {ES: '{make} {model} {years} precio segunda mano {sites}', EN: '{make} {model} {years} used price {sites}'}
  open:
    - '{make} {model} {years} segunda mano precio valor de mercado'
    - '{make} {model} {generation} segunda mano precio cuánto cuesta guía de compra'
    - '{make} {model} {generation} used buying guide how much to pay'
# spec 006 R10: extra favourite queries for electric and plug-in cars (one search each, first site group).
# `_ev`: range, kWh/100 km, battery and charging; `_cs`: a plug-in's consumption with an empty battery.
specs_ev:
  favourite: '{short} autonomía consumo kWh batería carga {sites}'
  favourite_by_market: {ES: '{short} autonomía consumo kWh batería carga {sites}', EN: '{short} range kWh battery charging {sites}', DE: '{short} Reichweite Verbrauch kWh Akku Laden {sites}'}
specs_cs:
  favourite: '{short} consumo batería descargada {sites}'
  favourite_by_market: {ES: '{short} consumo batería descargada {sites}', EN: '{short} fuel consumption battery depleted {sites}', DE: '{short} Verbrauch leerer Akku {sites}'}
measured_ev:
  favourite: '{short} autonomía real prueba {sites}'
  favourite_by_market: {ES: '{short} autonomía real prueba {sites}', EN: '{short} real world range test {sites}', DE: '{short} Reichweite Test Verbrauch {sites}'}
measured_cs:
  favourite: '{short} prueba consumo real {sites}'
  favourite_by_market: {ES: '{short} prueba consumo real {sites}', EN: '{short} real fuel consumption test {sites}', DE: '{short} Test Verbrauch {sites}'}
