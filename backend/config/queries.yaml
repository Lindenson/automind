# Search query templates per research area (spec 003 research R2).
# favourite: one query per group of favourite sites ({sites} = `site:a OR site:b …`), run first.
# open: open-web queries, run only when the favourites did not meet the area minimum.
# Placeholders: {make} {model} {generation} {variant} {years} {sites}. Classifieds are deny-listed.
version: 2
specs:
  favourite: '{make} {model} {generation} {variant} {sites}'
  open:
    - '{make} {model} {generation} {variant} specifications power torque weight 0-100'
    - '{make} {model} {generation} {variant} ficha técnica peso potencia par'
engineering:
  favourite: '{make} {model} {generation} {variant} engine technical {sites}'
  open:
    - '{make} {model} {generation} {variant} engine bore stroke compression ratio platform
  suspension'
    - '{make} {model} {generation} technical analysis chassis drivetrain engineering'
    - '{make} {model} {generation} model year changes facelift update new engine'
measured:
  favourite: '{make} {model} {generation} {variant} test 0-100 {sites}'
  open:
    - '{make} {model} {generation} {variant} instrumented test 0-100 km/h measured'
price:
  favourite: '{make} {model} {variant} precio {sites}'
  open:
    - '{make} {model} {variant} precio oficial España PVP'
    - '{make} {model} precio tarifa España {generation}'
maintenance:
  favourite: '{make} {model} {generation} mantenimiento service {sites}'
  open:
    - '{make} {model} {generation} {variant} service schedule maintenance intervals cost'
    - '{make} {model} {generation} plan de mantenimiento revisiones intervalos coste'
reviews:
  favourite: '{make} {model} {generation} {variant} review {sites}'
  open:
    - '{make} {model} {generation} {variant} review pros cons'
    - '{make} {model} {generation} owner reviews opinions problems'
    - '{make} {model} {generation} prueba opinión'
reliability:
  favourite: '{make} {model} {generation} reliability problems {sites}'
  open:
    - '{make} {model} {generation} reliability common problems known issues'
    - '{make} {model} {generation} fiabilidad averías comunes'
    - '{make} {model} {generation} TÜV report breakdown statistics'
manufacturer:
  favourite: '{make} ventas España cuota de mercado concesionarios {sites}'
  open:
    - '{make} car manufacturer history market position premium brand'
    - '{make} market share Europe Spain sales trend'
    - '{make} annual results operating profit automotive'
    - '{make} reliability ranking brand survey'
    - '{make} matriculaciones España cuota de mercado red de concesionarios'
    - '{make} concesionarios talleres red oficial España'
depreciation:
  favourite: '{make} {model} valor residual depreciación residual value {sites}'
  open:
    - '{make} {model} {generation} residual value after 3 years 5 years depreciation'
    - '{make} {model} valor residual depreciación 3 años 5 años'
    - '{make} {model} {generation} resale value retention ranking'
used_issues:
  favourite: '{make} {model} {generation} used buying guide {sites}'
  open:
    - '{make} {model} {generation} {years} used buying guide what to check high mileage'
    - '{make} {model} {generation} timing belt gearbox rust problems age mileage'
    - '{make} {model} {generation} segunda mano qué revisar problemas'
used_price:
  favourite: '{make} {model} {generation} {years} used price {sites}'
  open:
    - '{make} {model} {generation} segunda mano precio cuánto cuesta guía de compra'
    - '{make} {model} {generation} used buying guide how much to pay'
