# Known generations with production years (end: null = in production). Used to decide whether a
# used car without a year spans more than one generation (FR-005, FR-008) and to validate the
# resolver's answer. Seed knowledge, extendable; the resolver adds years for models not listed.
# Keys are canonical "Make|Model" (see aliases.yaml).
