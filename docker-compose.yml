# AutoMind deployment. Use scripts/deploy.sh (it creates .env.docker with the database password).
# Local development without Docker: scripts/dev.sh
name: automind

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: [.env.docker]
    environment:
      POSTGRES_USER: automind
      POSTGRES_DB: automind
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automind -d automind"]
      interval: 5s
      retries: 20

  app:
    build: .
    image: automind:latest
    restart: unless-stopped
    env_file: [.env, .env.docker]
    environment:
      DATABASE_URL: postgresql+asyncpg://automind:${POSTGRES_PASSWORD:?run scripts/deploy.sh}@postgres:5432/automind
    ports: ["${AUTOMIND_BIND:-127.0.0.1}:${AUTOMIND_PORT:-8080}:8000"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
