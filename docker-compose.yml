# Deployment / Docker-based dev (requires Docker). Local dev without Docker: scripts/dev.sh
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: automind, POSTGRES_PASSWORD: automind, POSTGRES_DB: automind }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U automind"], interval: 5s, retries: 10 }
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://automind:automind@postgres:5432/automind
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { postgres: { condition: service_healthy } }
volumes:
  pgdata:
